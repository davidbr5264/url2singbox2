<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Forge | VLESS to Sing-Box</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Config Forge</h1>
            <p>Convert vless:// links to sing-box client configurations instantly.</p>
        </header>
        
        <main>
            <div class="input-group">
                <label for="vlessUri">VLESS URI</label>
                <textarea id="vlessUri" rows="4" placeholder="vless://uuid@server:port?encryption=none&..."></textarea>
            </div>

            <div class="toggles-group">
                <label class="toggle-label">
                    <input type="checkbox" id="optBlockQuic" checked>
                    Block UDP/443 (QUIC)
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="optStrictRoute" checked>
                    Strict TUN Routing
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="optBlockIpv6" checked>
                    Reject IPv6 Traffic
                </label>
            </div>

            <button id="btnGenerate" class="primary-btn">Generate config.json</button>
            
            <div class="output-group" id="outputSection" style="display: none;">
                <label for="configOutput">Generated JSON</label>
                <textarea id="configOutput" rows="10" readonly></textarea>
                <button id="btnCopy" class="secondary-btn">Copy to Clipboard</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
